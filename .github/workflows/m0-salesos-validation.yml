name: M0 SalesOS validation

on:
  push:
    branches:
      - main
  # Every PR runs the full gate (no path filter) so the check can be
  # required by branch protection without blocking docs-only PRs.
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Unit/component tests
        run: npm test
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: End-to-end tests + screenshots
        run: npm run test:e2e
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-salesos-playwright-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
